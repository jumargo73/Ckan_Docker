
networks:
  ckan-hijo-net:
    name: ckan-hijo-net
    driver: bridge    

volumes:
  pg_data:
  solr_data:
  ckan_storage:
  pip_cache:
  site_packages:

services:

  db:
    build:
      context: postgresql/
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - CKAN_DB_USER
      - CKAN_DB_PASSWORD
      - CKAN_DB
      - DATASTORE_READONLY_USER
      - DATASTORE_READONLY_PASSWORD
      - DATASTORE_DB
    env_file:
      - .env  
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - ckan-hijo-net     
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_PASSWORD}"]    

  datapusher:
    networks:
      - ckan-hijo-net
    image: ckan/ckan-base-datapusher:${DATAPUSHER_VERSION}
    environment:
      DATAPUSHER_API_TOKEN: ${DATAPUSHER_API_TOKEN}
    volumes:
      - ./datapusher/deployment/datapusher_settings.py:/srv/app/datapusher_settings.py
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://datapusher:8800"]
      interval: 60s
      timeout: 10s
      retries: 3
  solr:
    image: ckan/ckan-solr:2.10-solr9
    volumes:
      - solr_data:/var/solr
    networks:
      - ckan-hijo-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://solr:8983/solr"]
      interval: 10s
      timeout: 5s
      retries: 5  

  redis:
    image: redis:7
    networks:
      - ckan-hijo-net
    healthcheck:
      test: ["CMD", "redis-cli", "-e", "QUIT"]    

  ckan:
    build:
      context: .
      dockerfile: ./ckan/Dockerfile
    image: ckan:2.11
    depends_on:
      db:
        condition: service_healthy
      solr:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "5000:5000"
    volumes:
      - ./ckan/ckan.ini:/srv/app/ckan.ini
      - ./ckan/src/ckan/ckan/model/__init__.py:/srv/app/src/ckan/ckan/model/__init__.py
      - ./ckan/src/ckan/ckan/model/package.py:/srv/app/src/ckan/ckan/model/package.py
      - ./ckan/src/ckan/ckan/model/contador.py:/srv/app/src/ckan/ckan/model/contador.py
      - ./ckan/src/ckan/ckan/model/resourceRating.py:/srv/app/src/ckan/ckan/model/resourceRating.py
      - ./ckan/src/ckan/ckan/logic/schema.py:/srv/app/src/ckan/ckan/logic/schema.py
